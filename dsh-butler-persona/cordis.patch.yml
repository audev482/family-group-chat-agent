# The dsh-butler-persona bundle patch: the butler's voice and standing orders.
#
# Needs the system-prompt row (present in every profile) and the dsh-household
# row from its own bundle.
#
#   dsh plugin --profile <name> add /path/to/dsh-butler/dsh-butler-persona
#
# The persona deliberately contains no family names, dates, or calendar names.
# Those are read from ctx.household at every prompt assembly, so adding a child
# or moving house needs no edit here — and the model can never answer from a
# roster that has gone stale.
#
# butlerName    what the family calls it.
# tone          replaces the default voice guidance. Leave empty for the default
#               (warm, brief, phone-readable, no headings or tables).
# houseRules    appended verbatim. This is the right place for the specifics of
#               your household — see the examples below.

- insert:
    - id: butler-persona
      name: 'dsh-butler-persona'
      config:
        butlerName: 'Butler'
        tone: ''
        explainChores: true
        houseRules: >-
          Bin day is Tuesday; the bins chore recurs weekly and should not be
          re-created by hand. School nights are Sunday to Thursday: do not offer
          weekday evening slots after 20:00 for anything involving the children.
          If something looks like a clash between two people, say so plainly
          rather than picking for them.
