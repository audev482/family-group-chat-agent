---
# Copy to secrets.yml, fill in, and keep it out of version control:
#
#     cp deploy/secrets.example.yml deploy/secrets.yml
#     $EDITOR deploy/secrets.yml
#     ansible-vault encrypt deploy/secrets.yml      # optional but sensible
#
# The play refuses to run with any of these blank rather than writing an
# environment file that would fail at runtime with a confusing error. Every one is
# reached by *reference* from the plugin configuration — the plugins name a
# credential, the credential provider reads the environment, and no secret is ever
# written into a config file or an event.

# The model provider. Without this the butler boots and cannot think.
DEEPSEEK_API_KEY: ""

# Nextcloud app password — NOT your account password.
# Settings → Security → Devices & sessions → Create new app password.
NEXTCLOUD_APP_PASSWORD: ""

# Yahoo app password — NOT your account password.
# Account Info → Account Security → Generate app password.
YAHOO_APP_PASSWORD: ""

# Discord bot token, from the Developer Portal → your application → Bot.
DISCORD_BOT_TOKEN: ""

# The Tricount sharing token. Open the tricount in the app, ⋯ → Share, and take the
# token from the link — it looks like `tABC123xyz`. Treat it as a password: anyone
# holding it can read and write the whole ledger.
TRICOUNT_TOKEN: ""

# Leave both of these blank on a first run. The butler will mint a device identity
# and report it once through the `tricount/device` event; copy the values out of the
# journal into here and re-run the play, so the identity survives restarts instead of
# registering a new anonymous user on every boot.
#
#     journalctl -u dsh-butler | grep -A3 tricount/device
#
# The public key is not cryptographically sensitive — the protocol never uses it to
# verify anything — but it is bulky and identity-bearing, so it lives here rather
# than in the committed config.
TRICOUNT_APP_ID: ""
TRICOUNT_PUBLIC_KEY: ""
